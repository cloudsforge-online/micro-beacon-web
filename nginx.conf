# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. A "page not found" screen delivered as a success is indexed by
# search engines, called healthy by uptime checks, passed by link checkers — and a deploy that
# drops a route then looks exactly like a deploy that did not.
#
# That is worse on this surface than on most, because of what this surface IS. Beacon is the thing
# the estate asks "did anything break", and a monitor pointed at a Beacon console that answers 200
# for every address is a monitor that cannot see its own monitor being broken.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list, `ROUTES` in src/lib/routes.ts and the route table in src/app.tsx must
# agree. test/routes.test.ts reads all three and fails when any has drifted; "remember to update
# nginx.conf" is not a mechanism.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# ENVIRONMENT rather than a surface: `surfaces.ts:1065-1071` reserves them so that no surface may
# take one as a subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`beacon-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this surface
# at the two-label `beacon.testnet.<apex>` — unreachable, because Cloudflare's Universal SSL is a
# one-label wildcard and every two-label name fails the handshake at the edge). `surfaces.ts` keeps
# the old shape deliberately, so both have to match.
#
# ══════════════════════════════════════════════════════════════════════════════════════════════
# AND ON THIS SURFACE `$cf_env` IS DECLARED AND NEVER READ. THAT IS THE POINT, NOT AN OVERSIGHT.
#
# On every other surface the map is a branch: mainnet invites crawlers and publishes a sitemap,
# and every other environment answers `Disallow: /` because a testnet estate carries test EMBER, a
# faucet and deliberately broken states that must not compete with the real ones in a search index.
#
# There is nothing to branch on here. `beacon` is `adminOnly: true`
# (`ui/packages/ui/src/surfaces.ts:448`), so `robotsDirective()` (`seo.ts:139-142`) resolves to
# `noindex, nofollow` on EVERY environment including production, and the two blocks below are
# already at the strictest answer the branch could reach. A conditional would be a decision that
# has only one outcome, which is the shape of a rule the next reader deletes as dead — correctly,
# and then reintroduces wrongly when the branch is finally needed.
#
# It is kept, unread, for one reason worth more than the four lines it costs: the alternation is
# the estate's single definition of "is this hostname production", and test/sitemap.test.ts pins it
# to `ENV_LABELS`. Keeping it means this surface PARTICIPATES in that check rather than opting out
# of it, so an environment label added to the registry goes red in seventeen repositories instead
# of sixteen. A surface that dropped the map would be the one nobody notices is stale.
# ══════════════════════════════════════════════════════════════════════════════════════════════
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self: the bar carries a session, and an operator console framed by
    # another origin is a clickjacking surface for whatever that session can do — which here means
    # reading the estate's incident list.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- the service's own paths, refused LOUDLY -------------------------
    #
    # ══════════════════════════════════════════════════════════════════════════════════════════
    # THIS BLOCK IS THE ONE THAT IS NOT IN THE TEMPLATE, AND IT EXISTS BECAUSE OF WHERE THIS
    # BUNDLE HAS TO LIVE.
    #
    # In production this bundle and micro-beacon share ONE hostname, `beacon.<apex>` — that is
    # what makes `apiBase()` the empty string and every request same-origin, and it is the only
    # arrangement a browser can use, because Beacon sends no `access-control-*` header of its own
    # and answers 404 to a preflight (see the header of vite.config.ts).
    #
    # Sharing a hostname means something in front of both has to decide which of them answers a
    # given path. Today nothing does: `deploy/gateway/dynamic/estate-web.yml:432` routes the WHOLE
    # host to the API and says so — "no bundle is served at `beacon.<apex>`". Serving this bundle
    # requires a path-prefix rule at a higher priority for `/v1`, `/api`, `/metrics`, `/livez` and
    # `/readyz`. That is a change in micro-deploy, and it is listed in this repository's README
    # under "What deploy has to do".
    #
    # Until it exists — and after it exists, if it is ever mis-ordered — a request for `/v1/gate`
    # arrives HERE. Letting it fall through to `error_page 404 /index.html` would render the
    # operator console at an API address with a 404 status: technically honest, and completely
    # unreadable as a diagnosis. `return 404 <text>` answers directly and does NOT re-enter
    # `error_page`, so the operator gets the sentence that names the actual defect.
    # ══════════════════════════════════════════════════════════════════════════════════════════
    location ~ ^/(v1|api|metrics|livez|readyz)(/|$) {
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        return 404 "This container serves the beacon-web bundle only. This path belongs to micro-beacon and must be routed to the service ahead of this bundle; see deploy/gateway/dynamic/estate-web.yml.\n";
    }

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location that sets
        # Cache-Control must restate the security headers, or it silently serves without them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        # REPEATED, because `error_page 404 /index.html` IS an internal redirect — unlike
        # `try_files`, it re-enters this block. So an honest 404, the thing this whole config
        # exists to preserve, would otherwise be served with Cache-Control and NOTHING ELSE.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts and the table in src/app.tsx.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — this location has to declare no-store
        # itself. It is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # `/?$` AND NOT `(/|$)`, AND THE DIFFERENCE IS THE WHOLE POINT OF THIS FILE.
    #
    # `(/|$)` is a PREFIX: it matches /journeys, and it also matches /journeys/anything/at/all. The
    # router does not — none of these routes has children, so /journeys/deeper falls to `path="*"`
    # and renders NotFoundPage. Under `(/|$)` that page would be served with 200, which is the
    # precise failure the header of this file says the enumeration exists to prevent.
    #
    # Every route this app owns is childless, so `/?$` is right for all of them. A route WITH
    # children would have to be enumerated in its own child shape rather than reaching for
    # `(/|$)`.
    location ~ ^/(journeys|probes|incidents|objectives|conformance)/?$ {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate all four.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- what a crawler is told, and what it is not given -----------------
    #
    # ══════════════════════════════════════════════════════════════════════════════════════════
    # THIS SURFACE REFUSES EVERY CRAWLER ON EVERY ENVIRONMENT, AND PUBLISHES NO SITEMAP AT ALL.
    #
    # DERIVED, not chosen here. `robotsDirective()` (`ui/packages/ui/src/seo.ts:139-142`) reads two
    # registry fields and nothing else, and `beacon` carries `adminOnly: true`
    # (`ui/packages/ui/src/surfaces.ts:448`), so the directive is `noindex, nofollow` — which is
    # what index.html states statically and what `DocumentMeta` applies on every navigation.
    # These two blocks are the third statement of the same fact, in the layer a crawler reads
    # FIRST, before it has fetched a page or run a line of script.
    #
    # Why an operator console is treated this way at all: hiding it is NOT the security boundary —
    # `authorise()` (`beacon/src/server.ts:870-898`) requires a token on every `/v1` route and this
    # bundle can read nothing without one. It is that a search result CONFIRMS the console exists,
    # names it and gives its address, and "no information is available for this page" is still a
    # result. That is reconnaissance handed over for free, and there is no argument on the other
    # side: nobody arrives at a release gate from a search engine.
    #
    # ── AND THERE IS NO `Sitemap:` LINE, WHICH IS THE HALF THAT IS EASY TO GET WRONG ───────────
    #
    # A `robots.txt` that says `Disallow: /` and then points at a sitemap is a contradiction that
    # resolves in the crawler's favour: the sitemap directive is INDEPENDENT of the user-agent
    # groups above it, so a crawler is entitled to fetch and read the sitemap it names even while
    # obeying the disallow. Naming one would hand over the exact list of addresses the disallow
    # exists to withhold. `robotsTxt({ indexable: false })` in @cloudsforge/ui emits no Sitemap line
    # for precisely this reason (`sitemap.ts:166-176`), and test/sitemap.test.ts compares this body
    # with that function's output byte for byte rather than reading it.
    #
    # /sitemap.xml therefore 404s, always, and this surface is absent from the ESTATE sitemap too —
    # `SITEMAP_SURFACES` (`ui/packages/ui/src/sitemap.ts:47-49`) filters `adminOnly` rows out, so
    # `site`'s own sitemap already omits it and nothing there needs changing. The test asserts that
    # filter still excludes `beacon`, because the day it stops is the day this file is wrong.
    # ══════════════════════════════════════════════════════════════════════════════════════════
    location = /robots.txt {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.txt` in the URI to `text/plain` from its own table anyway —
        # which is the same answer, and is exactly why it is written out: a `default_type` line
        # that happens to agree with the table it never beat reads as a decision and is not one.
        types { }
        default_type text/plain;
        # REPEATED, NOT INHERITED — the rule this file states twice above. A location declaring ANY
        # add_header inherits NONE from the server level, so Cache-Control here would otherwise
        # ship robots.txt with no nosniff, no frame-options and no referrer-policy.
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Written as a real multi-line literal rather than with `\n` escapes so that the body in
        # this file is the body on the wire, character for character, and the test comparing it
        # with `robotsTxt()` is comparing the thing rather than a rendering of it. The trailing
        # newline is inside the quotes and is not decoration: robots.txt is a line-oriented format
        # and parsers differ on whether an unterminated last line counts.
        return 200 'User-agent: *
Disallow: /
';
    }

    location = /sitemap.xml {
        # No `types { }` and no `default_type`: this location has no body to type. `return 404`
        # with no text hands the response to `error_page 404 /index.html` — which is correct and is
        # what a crawler asking for a sitemap that does not exist should get, the same 404 as any
        # other address this surface does not serve, indistinguishable from it.
        #
        # `= /sitemap.xml` exists ANYWAY, and is not redundant with that fallthrough. `location /`
        # below would serve `public/sitemap.xml` if one were ever added, and this block guarantees
        # the answer stays 404 whatever appears in the static tree. test/sitemap.test.ts asserts
        # from the other direction too, that no such file exists to be shadowed.
        return 404;
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon) is served; anything else 404s, and the error page below turns that 404
    # into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works.
    #
    # On any other surface the comment here reads "that is Beacon's job". It cannot read that
    # here: this IS Beacon's console, and a console cannot be the evidence that the service behind
    # it is answering. That is what `beacon/src/browser/smoke.ts` is for.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
